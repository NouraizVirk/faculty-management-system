apiVersion: apps/v1
kind: Deployment
metadata:
  name: faculty-backend
  labels:
    app: faculty-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faculty-backend
  template:
    metadata:
      labels:
        app: faculty-backend
    spec:
      containers:
        - name: faculty-backend
          image: faculty-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: faculty-secrets
                  key: db-host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: faculty-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: faculty-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: faculty-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: faculty-backend-svc
spec:
  selector:
    app: faculty-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faculty-frontend
  labels:
    app: faculty-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faculty-frontend
  template:
    metadata:
      labels:
        app: faculty-frontend
    spec:
      containers:
        - name: faculty-frontend
          image: faculty-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: faculty-frontend-svc
spec:
  selector:
    app: faculty-frontend
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
